# 注意：这两个值原本是 electron-vite 脚手架的占位默认值（com.electron.app / desktop），
# 会把安装目录、快捷方式名、卸载显示名、userData 路径全部带成 "desktop"。
# productName 管**显示名**（快捷方式 / 开始菜单 / 卸载项 / userData 目录）；
# 安装目录则来自 package.json 的 name（见文末说明）。
appId: com.smartscrm.desktop
productName: SmartSCRM
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/inject.bundle.js
    to: inject.bundle.js
  - from: resources/msg-bridge.bundle.js
    to: msg-bridge.bundle.js
  - from: resources/wa-js.bundle.js
    to: wa-js.bundle.js
win:
  executableName: SmartSCRM
nsis:
  # 用 ${productName} 而非 ${name}：本包名是**带作用域**的 `@smartscrm/desktop`，
  # ${name} 会把 `/` 当成路径分隔符，输出路径变成 dist\@smartscrm\... 而该子目录不会被创建，
  # makensis 直接报 "Can't open output file" 退出 1（2026-10-07 实测踩到）。
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
