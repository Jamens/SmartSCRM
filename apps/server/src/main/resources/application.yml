spring:
  application:
    name: scrm-server

  datasource:
    url: jdbc:mysql://localhost:3306/smartscrm_react?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "1234560"
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8180

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

app:
  jwt:
    secret: "smartscrm-local-dev-secret-key-please-change-32bytes-min"
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 2592000

logging:
  level:
    com.smartscrm: debug
